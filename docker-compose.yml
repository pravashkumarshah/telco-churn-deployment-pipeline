services:
  telco-churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: telco-churn-api:1.0
    container_name: telco-churn-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CHURN_API_KEY=${CHURN_API_KEY}
      - MODEL_PATH=/app/artifacts/model_bundle.joblib
      - ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
