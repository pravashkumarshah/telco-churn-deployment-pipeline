name: CI/CD Pipeline & Deployment Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Download Dataset with SHA-256 Verification
        run: python scripts/download_data.py
      - name: Train Reference Model Bundle
        run: python scripts/train.py --n-iter 4 --cv-folds 2
      - name: Run Pytest Suite
        run: python -m pytest -v
      - name: Upload Model Artifacts (Python 3.13)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
          retention-days: 1

  docker-build-and-verify:
    name: Docker Build & Container Verification
    runs-on: ubuntu-latest
    needs: unit-and-integration
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
      - name: Build Docker Image
        run: docker build -t telco-churn-api:ci .
      - name: Verify Container Image Size (< 600 MB)
        run: |
          chmod +x scripts/check_container_size.sh
          ./scripts/check_container_size.sh telco-churn-api:ci 600
      - name: Run Container as Non-Root User
        run: |
          docker run -d \
            --name telco-api-container \
            -p 8000:8000 \
            -e CHURN_API_KEY="ci-test-secure-key-2026" \
            -v "$(pwd)/artifacts:/app/artifacts:ro" \
            telco-churn-api:ci
      - name: Verify Non-Root User Execution
        run: |
          USER_ID=$(docker exec telco-api-container id -u)
          USER_NAME=$(docker exec telco-api-container whoami)
          echo "Container running as user: $USER_NAME (UID: $USER_ID)"
          if [ "$USER_ID" -eq 0 ]; then
            echo "ERROR: Container is running as root!"
            exit 1
          fi
          echo "PASS: Container running as non-root user ($USER_NAME)."
      - name: Await Container Healthiness
        run: |
          echo "Waiting for container health check..."
          HEALTHY=false
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' telco-api-container 2>/dev/null || echo "starting")
            echo "Health status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              docker logs telco-api-container
              exit 1
            fi
            sleep 2
          done
          if [ "$HEALTHY" != "true" ]; then
            docker logs telco-api-container
            echo "ERROR: Container did not become healthy within 60 seconds."
            exit 1
          fi
      - name: Verify All Endpoints & Authentication
        env:
          CHURN_API_KEY: "ci-test-secure-key-2026"
          API_BASE_URL: "http://127.0.0.1:8000"
        run: python scripts/verify_container.py
      - name: Test Graceful Shutdown
        run: |
          echo "Stopping container with 10s graceful timeout..."
          docker stop -t 10 telco-api-container
          EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' telco-api-container)
          echo "Container exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: Container did not shut down cleanly."
            docker logs telco-api-container
            exit 1
          fi
          echo "PASS: Container shut down cleanly."
